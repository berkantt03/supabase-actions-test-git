name: Supabase Database Migrations

#on:
 # push:
    #branches:
      #- main
   # paths:
      #- 'supabase/migrations/**'

jobs:
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push DB Migrations
        # Yeni eklediğimiz DB_URL secret'ını komuta doğrudan veriyoruz
        run: supabase db push --db-url ${{ secrets.SUPABASE_DB_URL }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
